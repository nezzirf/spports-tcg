<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports TCG Elite - Jeu de Booster</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tcg: { dark: '#03050a', card: '#0d1322', border: '#1e293b' }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Rajdhani:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #03050a;
            color: #f8fafc;
            overflow: hidden;
        }
        .bg-pattern {
            position: absolute; inset: 0; z-index: 0; pointer-events: none;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(14, 165, 233, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
                radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 100% 100%, 100% 100%, 24px 24px;
        }
        .font-sport { font-family: 'Rajdhani', sans-serif; }
        .tab-content { display: none; opacity: 0; transition: opacity 0.25s ease-in-out; }
        .tab-content.active { display: block; opacity: 1; }
        
        .pokemon-card {
            aspect-ratio: 4 / 6;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.9), inset 0 0 6px rgba(255, 255, 255, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            border: 6px solid var(--border-color);
            overflow: hidden;
        }

        .card-image-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            border-radius: 10px;
            background-color: #0b0f19;
        }

        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 25%;
        }

        .card-inner-border {
            position: absolute;
            inset: 4px;
            border: 2px solid #000000;
            border-radius: 10px;
            pointer-events: none;
            z-index: 15;
        }

        .pokemon-card:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 24px 45px rgba(0, 0, 0, 0.98);
        }

        .rarity-0 { --border-color: #94a3b8; --rarity-color: #94a3b8; }
        .rarity-1 { --border-color: #4ade80; --rarity-color: #4ade80; }
        .rarity-2 { --border-color: #38bdf8; --rarity-color: #38bdf8; }
        .rarity-3 { --border-color: #fb923c; --rarity-color: #fb923c; }
        .rarity-4 { --border-color: #facc15; --rarity-color: #facc15; }
        .rarity-5 { --border-color: #f472b6; --rarity-color: #f472b6; }

        .themed-text { color: var(--rarity-color); }
        .themed-border { border-color: var(--rarity-color); }
        
        .name-banner { 
            position: absolute;
            bottom: -6px;
            left: -6px;
            right: 18px;
            width: auto;
            background-color: #0b0f19; 
            box-sizing: border-box;
            border-top-right-radius: 8px;
            border-bottom-right-radius: 0px;
            border-bottom-left-radius: 12px;
            border-top-left-radius: 0px;
            z-index: 20;
        }

        .holo-sheen {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                120deg,
                transparent 30%,
                rgba(255, 255, 255, 0.35) 45%,
                rgba(255, 255, 255, 0.75) 50%,
                rgba(255, 255, 255, 0.35) 55%,
                transparent 70%
            );
            pointer-events: none;
            mix-blend-mode: overlay;
            animation: holoMove 4s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes holoMove {
            0% { transform: translateY(-120%) translateX(-120%) rotate(25deg); }
            20% { transform: translateY(120%) translateX(120%) rotate(25deg); }
            100% { transform: translateY(120%) translateX(120%) rotate(25deg); }
        }

        /* --- STYLES ET ANIMATIONS POUR LE NOUVEAU BOOSTER --- */
        .booster-3d-wrapper {
            perspective: 1200px;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .booster-container-hover {
            width: 310px;
            height: 520px;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s ease;
        }

        .booster-container-hover:hover {
            transform: rotateY(8deg) rotateX(4deg) translateY(-8px);
            filter: drop-shadow(-20px 40px 30px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 35px rgba(56, 189, 248, 0.4));
        }

        .custom-booster-pack {
            width: 310px;
            height: 520px;
            position: relative;
            background: #03050a;
            border-radius: 8px;
            box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.95);
            overflow: hidden;
        }

        .booster-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Pièce supérieure découpée (Pliure du haut) */
        .crimp-seal-top-severed {
            position: absolute;
            top: 0; left: 0;
            width: 310px; height: 60px;
            z-index: 40;
            pointer-events: none;
            overflow: hidden;
            clip-path: polygon(
                0% 0%, 100% 0%,
                100% 45px, 85% 55px, 70% 48px, 55% 58px, 40% 46px, 25% 56px, 10% 48px, 0% 55px
            );
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
        }

        .crimp-seal-top-severed img {
            width: 310px;
            height: 520px;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Corps principal du paquet après déchirure */
        .booster-body-severed {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
            clip-path: polygon(
                0% 55px, 10% 48px, 25% 56px, 40% 46px, 55% 58px, 70% 48px, 85% 55px, 100% 45px,
                100% 100%, 0% 100%
            );
            overflow: hidden;
        }

        .booster-body-severed img {
            width: 310px;
            height: 520px;
            object-fit: cover;
        }

        .foil-reflection {
            position: absolute; inset: 0;
            background: linear-gradient(
                105deg,
                transparent 25%,
                rgba(255, 255, 255, 0.15) 42%,
                rgba(255, 255, 255, 0.35) 50%,
                rgba(255, 255, 255, 0.15) 58%,
                transparent 75%
            );
            pointer-events: none; z-index: 25;
        }

        .cutting-laser {
            position: absolute; top: 48px; left: 0; height: 4px; width: 0%;
            background: linear-gradient(90deg, #38bdf8, #ffffff, #f59e0b);
            box-shadow: 0 0 15px #ffffff, 0 0 25px #f59e0b;
            z-index: 50; pointer-events: none; opacity: 0;
        }

        .anim-cut-laser { animation: laserCut 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes laserCut {
            0% { width: 0%; opacity: 1; }
            80% { width: 100%; opacity: 1; }
            100% { width: 100%; opacity: 0; }
        }

        .anim-top-tear { animation: topTearAway 0.6s 0.25s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; }
        @keyframes topTearAway {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-40px) translateX(25px) rotate(15deg); opacity: 0.9; }
            100% { transform: translateY(-100px) translateX(60px) rotate(32deg); opacity: 0; }
        }

        .anim-pack-open { animation: packOpenGlow 0.6s 0.2s ease-out forwards; }
        @keyframes packOpenGlow {
            0% { filter: brightness(1); }
            50% { filter: brightness(2) drop-shadow(0 0 45px rgba(56, 189, 248, 0.95)); }
            100% { filter: brightness(1); }
        }

        .textured-panel { background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, rgba(3, 7, 18, 0.95) 100%); border: 1px solid rgba(255, 255, 255, 0.08); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #03050a; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        .tab-collection {
            margin-top: 0 !important;
            padding-top: 0 !important;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen selection:bg-cyan-500 selection:text-white">

    <!-- BARRE LATÉRALE GAUCHE -->

        <div class="p-6 border-b border-slate-800/80 flex flex-col items-center md:items-start space-y-4">
            <div class="flex items-center space-x-3 w-full justify-center md:justify-start">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20 shrink-0">
                    <i class="fa-solid fa-bolt text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider uppercase font-sport text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400 leading-tight">SPORTS TCG</h1>
                    <p class="text-[10px] text-slate-400 font-medium">100% ATHLÈTES ACTIFS</p>
                </div>
            </div>
            <div class="w-full text-center md:text-left">
                <span class="inline-block bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-md text-[10px] font-bold uppercase tracking-widest"><i class="fa-solid fa-circle-check mr-1"></i> Packs Limités</span>
            </div>
        </div>

        <nav class="flex md:flex-col gap-2 p-4 overflow-x-auto md:overflow-visible flex-grow md:flex-grow-0">
            <button onclick="switchMainTab('tab-boosters')" id="nav-tab-boosters" class="main-tab-btn w-full px-4 py-3.5 rounded-xl font-bold font-sport text-sm uppercase tracking-wider flex items-center justify-center md:justify-start gap-3 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.15)] transition-all shrink-0">
                <i class="fa-solid fa-box-open w-5 text-center"></i><span>Ouvrir Boosters</span>
            </button>
            <button onclick="switchMainTab('tab-deck')" id="nav-tab-deck" class="main-tab-btn w-full px-4 py-3.5 rounded-xl font-bold font-sport text-sm uppercase tracking-wider flex items-center justify-center md:justify-start gap-3 text-slate-400 hover:bg-slate-800/50 hover:text-white transition-all shrink-0 border border-transparent">
                <i class="fa-solid fa-users w-5 text-center"></i><span>Mon Équipe</span>
            </button>
            <button onclick="switchMainTab('tab-collection')" id="nav-tab-collection" class="main-tab-btn w-full px-4 py-3.5 rounded-xl font-bold font-sport text-sm uppercase tracking-wider flex items-center justify-center md:justify-start gap-3 text-slate-400 hover:bg-slate-800/50 hover:text-white transition-all shrink-0 border border-transparent">
                <i class="fa-solid fa-book-open w-5 text-center"></i><span>Collection</span>
            </button>
        </nav>

        <div class="mt-auto p-6 hidden md:flex flex-col space-y-3 bg-slate-900/30 border-t border-slate-800/80">
            <h4 class="text-[10px] uppercase font-bold text-slate-500 tracking-widest">Progression Globale</h4>
            <div class="flex justify-between items-center text-sm font-sport font-bold">
                <span class="text-slate-300">Cartes débloquées</span>
                <span class="text-amber-400"><span id="nav-counter">0</span> / <span class="total-cards-label">0</span></span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-1.5 mt-1 overflow-hidden">
                <div id="progress-bar-fill" class="bg-gradient-to-r from-amber-500 to-yellow-300 h-1.5 rounded-full" style="width: 0%"></div>
            </div>
        </div>
    </aside>

    <!-- ZONE PRINCIPALE -->
    <main class="flex-1 h-full overflow-y-auto relative z-10 flex flex-col">
        <div class="bg-pattern"></div>
        
        <div class="w-full max-w-7xl mx-auto p-4 md:p-8 flex-grow flex flex-col relative z-10">
            
            <!-- ONGLET 1: BOOSTERS -->
            <section id="tab-boosters" class="tab-content active h-full w-full flex flex-col items-center">
                
                <!-- COMPTEUR DE PAQUETS -->
                <div class="flex flex-col items-center mb-4 space-y-2 pt-4">
                    <div class="bg-slate-900/80 border border-slate-700/80 px-6 py-2.5 rounded-2xl flex items-center gap-4 shadow-xl">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-box-open text-amber-400 text-lg"></i>

                                </div>
                                <div class="foil-reflection"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

                </div>
            </section>

                        </div>
                    </div>
                    <div class="flex items-center gap-2 overflow-x-auto pb-2" id="sports-tabs-bar"></div>
                </div>
                
                <div id="cards-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 pb-12 mt-4"></div>
            </section>
        </div>
    </main>

        const sportsNames = ['Football', 'Basketball', 'Cyclisme', 'Tennis', 'F1', 'Rugby', 'Athlétisme', 'Natation', 'Sports de combat', 'Handball'];
        const raritiesNames = ['Commune', 'Peu commune', 'Rare', 'Ultra rare', 'Légendaire', 'Mythique'];

        const maxScorePerSport = {};
        sportsNames.forEach((sport, idx) => {
            const sportAthletes = rawData.filter(d => d[1] === idx);
            if (sportAthletes.length > 0) maxScorePerSport[sport] = Math.max(...sportAthletes.map(d => d[3]));
        });

        const mythicAssigned = {};

        const athletesData = rawData.map((d, i) => {
            const name = d[0];
            const sport = sportsNames[d[1]];
            const score = d[3];
            const wikiSlug = d[4] || name.replace(/ /g, '_');
            
            let rarityId = R_COM;
            if (score === maxScorePerSport[sport] && !mythicAssigned[sport]) {
                rarityId = R_MYT; mythicAssigned[sport] = true;
            } else if (score >= 96) rarityId = R_LEG;
            else if (score >= 92) rarityId = R_ULT;
            else if (score >= 89) rarityId = R_RAR;
            else if (score >= 87) rarityId = R_PEU;
            else rarityId = R_COM;

            return {
                id: 'a_' + i, name: name, sport: sport,
                rarity: raritiesNames[rarityId], rarityId: rarityId,
                score: score, wikiSlug: wikiSlug
            };
        });

        const wikiImageCache = {};

        async function fetchWikiPhoto(slug) {
            if (wikiImageCache[slug] !== undefined) return wikiImageCache[slug];
            for (const lang of ['fr', 'en']) {
                try {
                    const res = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(slug)}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.thumbnail && data.thumbnail.source) {
                            wikiImageCache[slug] = data.thumbnail.source;
                            return data.thumbnail.source;
                        }
                    }
                } catch(e) {}
            }
            wikiImageCache[slug] = fallbackImage;
            return fallbackImage;
        }

        function playTearSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 0.45;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
                filter.frequency.linearRampToValueAtTime(3500, audioCtx.currentTime + 0.45);
                filter.Q.value = 3;
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.7, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
                noise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                noise.start();
            } catch (e) {}
        }

        function playSparkleSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [1046.50, 1318.51, 1567.98, 2093.00, 2637.02, 3135.96, 4186.01];
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.06);
                    gain.gain.setValueAtTime(0, audioCtx.currentTime + index * 0.06);
                    gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + index * 0.06 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + index * 0.06 + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + index * 0.06);
                    osc.stop(audioCtx.currentTime + index * 0.06 + 0.4);
                });
            } catch (e) {}
        }

        let currentSportTab = 'all';
        let showOwnedOnly = false;
        let userState = { collection: {}, deck: [null, null, null, null, null] };
        let currentPackCards = []; 
        let currentCardIndex = 0;
        let isOpening = false;

        const MAX_PACKS = 12;
        const REFILL_INTERVAL_MS = 3600 * 1000; // 1 heure

        function initPackSystem() {
            if (userState.packsCount === undefined) {
                userState.packsCount = 10;
                userState.lastPackTime = Date.now();
            }
            updatePackSystem();
            setInterval(updatePackSystem, 1000);
        }

        function updatePackSystem() {
            const now = Date.now();
            const elapsed = now - (userState.lastPackTime || now);

            if (userState.packsCount < MAX_PACKS) {
                const packsGagnees = Math.floor(elapsed / REFILL_INTERVAL_MS);
                if (packsGagnees > 0) {
                    userState.packsCount = Math.min(MAX_PACKS, userState.packsCount + packsGagnees);
                    userState.lastPackTime = userState.lastPackTime + (packsGagnees * REFILL_INTERVAL_MS);
                    if (userState.packsCount === MAX_PACKS) {
                        userState.lastPackTime = now;
                    }
                    saveUser();
                }
            } else {
                userState.lastPackTime = now;
            }

            let timeLeft = 0;
            if (userState.packsCount < MAX_PACKS) {
                const timeIntoCurrentInterval = (Date.now() - userState.lastPackTime) % REFILL_INTERVAL_MS;
                timeLeft = REFILL_INTERVAL_MS - timeIntoCurrentInterval;
            }

            renderPackUI(timeLeft);
        }

        function renderPackUI(timeLeft) {
            const badge = document.getElementById('pack-count-badge');
            const timerEl = document.getElementById('pack-cooldown-timer');
            
            if (badge) badge.textContent = `${userState.packsCount}/${MAX_PACKS}`;

            if (timerEl) {
                if (userState.packsCount >= MAX_PACKS) {
                    timerEl.textContent = "MAXIMUM";
                } else {
                    const hours = Math.floor(timeLeft / (1000 * 60 * 60));
                    const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                    timerEl.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                }
            }
        }

        async function initUser() {
            const saved = localStorage.getItem('sports_tcg_gold_pack_v12');
            if (saved) { try { userState = JSON.parse(saved); } catch(e) {} }
            if (!userState.collection) userState.collection = {};
            if (!userState.deck || userState.deck.length !== 5) {
                userState.deck = ['a_0', 'a_150', 'a_250', null, null]; 
                userState.collection['a_0'] = 1; userState.collection['a_150'] = 1; userState.collection['a_250'] = 1;
            }
            
            document.querySelectorAll('.total-cards-label').forEach(el => el.textContent = athletesData.length);
            initPackSystem();
            saveUser();
            renderSportTabsBar();
            updateUI();
        }

        function saveUser() {
            localStorage.setItem('sports_tcg_gold_pack_v12', JSON.stringify(userState));
            updateUI();
        }

        function switchMainTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.main-tab-btn').forEach(b => {
                b.className = "main-tab-btn w-full px-4 py-3.5 rounded-xl font-bold font-sport text-sm uppercase tracking-wider flex items-center justify-center md:justify-start gap-3 text-slate-400 hover:bg-slate-800/50 hover:text-white transition-all shrink-0 border border-transparent";
            });
            
            document.getElementById(tabId).classList.add('active');
            const activeBtn = document.getElementById(`nav-${tabId}`);
            if (activeBtn) {
                activeBtn.className = "main-tab-btn w-full px-4 py-3.5 rounded-xl font-bold font-sport text-sm uppercase tracking-wider flex items-center justify-center md:justify-start gap-3 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.15)] transition-all shrink-0";
            }

            if (tabId === 'tab-collection') renderCardsCatalogue();
            else if (tabId === 'tab-deck') { renderDeck(); renderDeckQuickAdd(); }
        }

        function renderSportTabsBar() {
            const container = document.getElementById('sports-tabs-bar');
            if (!container) return;
            let html = `<button onclick="switchSportTab('all')" id="sport-pill-all" class="sport-pill px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap bg-cyan-500 text-slate-950 shadow transition">Tous</button>`;
            sportsNames.forEach(sport => {
                html += `<button onclick="switchSportTab('${sport}')" id="sport-pill-${sport.replace(/\s+/g, '-')}" class="sport-pill px-4 py-1.5 bg-slate-900 border border-slate-700 text-slate-400 hover:text-white rounded-lg text-xs font-bold whitespace-nowrap transition">${sport}</button>`;
            });
            container.innerHTML = html;
        }

        function switchSportTab(sport) {
            currentSportTab = sport;
            document.querySelectorAll('.sport-pill').forEach(b => b.className = "sport-pill px-4 py-1.5 bg-slate-900 border border-slate-700 text-slate-400 hover:text-white rounded-lg text-xs font-bold whitespace-nowrap transition");
            const activeBtn = document.getElementById(sport === 'all' ? 'sport-pill-all' : `sport-pill-${sport.replace(/\s+/g, '-')}`);
            if (activeBtn) activeBtn.className = "sport-pill px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap bg-cyan-500 text-slate-950 shadow transition";
            renderCardsCatalogue();
        }

        function toggleOwnedFilter() {
            showOwnedOnly = !showOwnedOnly;
            document.getElementById('btn-toggle-owned').innerText = showOwnedOnly ? `Voir Tout (${athletesData.length})` : "Voir Possédés";
            document.getElementById('btn-toggle-owned').className = showOwnedOnly ? 
                "w-full sm:w-auto px-4 py-2 bg-cyan-600 border border-cyan-500 text-white rounded-xl text-sm font-bold transition whitespace-nowrap" : 
                "w-full sm:w-auto px-4 py-2 bg-slate-900 border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-800 rounded-xl text-sm font-bold transition whitespace-nowrap";
            renderCardsCatalogue();
        }

        function updateUI() {
            const totalCollected = Object.keys(userState.collection).length;
            const totalCards = athletesData.length;
            document.getElementById('collection-counter-text').innerHTML = `${totalCollected} / <span class="total-cards-label">${totalCards}</span> DÉBLOQUÉS`;
            document.getElementById('nav-counter').innerText = totalCollected;
            const progressPercent = (totalCollected / totalCards) * 100;
            document.getElementById('progress-bar-fill').style.width = `${progressPercent}%`;

            if(document.getElementById('tab-collection').classList.contains('active')) renderCardsCatalogue();
            if(document.getElementById('tab-deck').classList.contains('active')) { renderDeck(); renderDeckQuickAdd(); }
        }

        function rollCard() {
            const rand = Math.floor(Math.random() * 1000) + 1;
            let targetRarityId = R_COM;
            
            if (rand === 1) targetRarityId = R_MYT;
            else if (rand <= 11) targetRarityId = R_LEG;
            else if (rand <= 51) targetRarityId = R_ULT;
            else if (rand <= 201) targetRarityId = R_RAR;
            else if (rand <= 501) targetRarityId = R_PEU;
            else targetRarityId = R_COM;

            let pool = athletesData.filter(a => a.rarityId === targetRarityId);
            if (pool.length === 0) {
                for (let r = targetRarityId - 1; r >= 0; r--) {
                    pool = athletesData.filter(a => a.rarityId === r);
                    if (pool.length > 0) break;
                }
            }
            if (pool.length === 0) pool = athletesData;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function startPackOpeningProcess() {
            if (isOpening) return;

            if (userState.packsCount <= 0) {
                alert("Tu n'as plus de paquets disponibles ! Attends le prochain rechargement.");
                return;
            }

            userState.packsCount--;
            if (userState.packsCount === MAX_PACKS - 1) {
                userState.lastPackTime = Date.now();
            }
            saveUser();
            updatePackSystem();

            isOpening = true;
            playTearSound();

            const rawDropped = [];
            for (let i = 0; i < 5; i++) rawDropped.push(rollCard());
            
            const dropped = rawDropped.map(card => {
                const alreadyOwned = (userState.collection[card.id] || 0) > 0;
                return { card: card, isNew: !alreadyOwned };
            });

            const hasHighRarity = dropped.some(item => item.card.rarityId >= 3);
            if (hasHighRarity) { playSparkleSound(); }

            dropped.sort((a, b) => a.card.rarityId - b.card.rarityId);
            
            dropped.forEach(item => { 
                userState.collection[item.card.id] = (userState.collection[item.card.id] || 0) + 1; 
            });
            saveUser();

            const pack = document.getElementById('main-booster-card');
            const laser = document.getElementById('laser-line');
            const topPiece = document.getElementById('booster-top-piece');

            laser.classList.add('anim-cut-laser');
            topPiece.classList.add('anim-top-tear');
            pack.classList.add('anim-pack-open');

            setTimeout(() => {
                currentPackCards = dropped;
                currentCardIndex = 0;

                laser.classList.remove('anim-cut-laser');
                topPiece.classList.remove('anim-top-tear');
                pack.classList.remove('anim-pack-open');
                isOpening = false;

                document.getElementById('pack-opening-modal').classList.remove('hidden');
                showCurrentCardInModal();
            }, 850);
        }

        async function showCurrentCardInModal() {
            const item = currentPackCards[currentCardIndex];
            document.getElementById('pack-progress-title').innerText = `Carte ${currentCardIndex + 1} sur ${currentPackCards.length}`;
            
            const photoUrl = await fetchWikiPhoto(item.card.wikiSlug);
            document.getElementById('pack-single-card-container').innerHTML = getCardHTML(item.card, photoUrl, true, false, true, item.isNew);
            document.getElementById('finish-pack-btn').classList.add('hidden');
        }

        async function showPackSummaryModal() {
            document.getElementById('pack-progress-title').innerText = 'RÉCAPITULATIF DU PACK';
            const container = document.getElementById('pack-single-card-container');
            container.className = "grid grid-cols-2 sm:grid-cols-5 gap-3 w-full my-4 max-w-5xl px-2";
            container.onclick = null;
            
            const cardsHtmlList = await Promise.all(currentPackCards.map(async (item) => {
                const photoUrl = await fetchWikiPhoto(item.card.wikiSlug);
                return `<div class="w-full flex items-center justify-center">${getCardHTML(item.card, photoUrl, true, true, false, item.isNew)}</div>`;
            }));
            
            container.innerHTML = cardsHtmlList.join('');
            document.getElementById('finish-pack-btn').classList.remove('hidden');
        }

        async function revealNextCardInPack() {
            if (currentCardIndex < currentPackCards.length - 1) {
                currentCardIndex++;
                await showCurrentCardInModal();
            } else {
                await showPackSummaryModal();
            }
        }

        function closePackOpening() {
            document.getElementById('pack-opening-modal').classList.add('hidden');
            const container = document.getElementById('pack-single-card-container');
            container.className = "cursor-pointer transition-transform hover:scale-105";
            container.onclick = revealNextCardInPack;
            updateUI();
        }

        function getCardHTML(athlete, imageUrl, isOwned = false, isSummary = false, isLarge = false, isNew = false) {
            const rClass = `rarity-${athlete.rarityId}`;
            const sIcon = sportIcons[athlete.sport] || 'fa-trophy';
            const sizeClass = isLarge ? "w-64 sm:w-72 md:w-80" : "w-full";
            const isHolo = athlete.rarityId >= R_ULT;
            const imgSrc = imageUrl || wikiImageCache[athlete.wikiSlug] || fallbackImage;

            return `
                <div class="pokemon-card ${rClass} ${sizeClass} ${!isOwned ? 'opacity-30 grayscale' : ''}">
                    <div class="card-image-container">
                        <img src="${imgSrc}" data-slug="${athlete.wikiSlug}" class="wiki-card-img" referrerpolicy="no-referrer" onerror="this.src='${fallbackImage}'">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/40"></div>
                    </div>
                    <div class="card-inner-border"></div>
                    ${isHolo ? '<div class="holo-sheen"></div>' : ''}
                    
                    <div class="absolute top-2.5 left-2.5 z-25 bg-slate-950/95 border-2 themed-border w-9 h-9 flex items-center justify-center rounded-xl shadow-xl">
                        <i class="fa-solid ${sIcon} text-sm themed-text"></i>
                    </div>

                    ${isNew ? `
                        <div class="absolute top-2 left-2 z-30 bg-gradient-to-r from-red-600/70 to-amber-500/70 backdrop-blur-[2px] text-white font-black text-[9px] px-1.5 py-0.5 rounded shadow-md border border-yellow-300/60 uppercase tracking-tighter transform -rotate-6 animate-pulse">
                            NEW
                        </div>
                    ` : ''}

                    <div class="absolute top-2.5 right-2.5 z-20 bg-slate-950/95 border-2 themed-border px-3.5 py-1 rounded-xl shadow-xl">
                        <span class="text-sm font-black themed-text tracking-wider">${athlete.score}</span>
                    </div>
                    <div class="name-banner border-2 themed-border py-2 px-3 shadow-2xl">
                        <h5 class="text-[11px] sm:text-xs font-black themed-text uppercase tracking-tight leading-tight truncate">${athlete.name}</h5>
                    </div>
                </div>
            `;
        }

        let renderTimeout;
        function renderCardsCatalogue() {
            const container = document.getElementById('cards-container');
            if (!container) return;
            const search = document.getElementById('search-input').value.toLowerCase();
            
            clearTimeout(renderTimeout);
            
            renderTimeout = setTimeout(() => {
                const filteredAthletes = athletesData.filter(athlete => {
                    if (search && !athlete.name.toLowerCase().includes(search)) return false;
                    if (currentSportTab !== 'all' && athlete.sport !== currentSportTab) return false;
                    const count = userState.collection[athlete.id] || 0;
                    if (showOwnedOnly && count === 0) return false;
                    return true;
                });

                if(filteredAthletes.length === 0) {
                    container.innerHTML = '<div class="col-span-full py-16 text-center text-slate-500 text-sm bg-slate-900/30 rounded-2xl border border-dashed border-slate-800">Aucun athlète trouvé pour cette recherche.</div>';
                    return;
                }

                let cardsHtml = '';
                for (const athlete of filteredAthletes) {
                    const count = userState.collection[athlete.id] || 0;
                    cardsHtml += getCardHTML(athlete, null, count > 0, false, false, false);
                }
                
                container.innerHTML = cardsHtml;
                lazyLoadWikiImages();
            }, 100);
        }

        function lazyLoadWikiImages() {
            const imgs = document.querySelectorAll('.wiki-card-img[data-slug]');
            imgs.forEach(async (img) => {
                const slug = img.getAttribute('data-slug');
                if (slug && !wikiImageCache[slug]) {
                    const src = await fetchWikiPhoto(slug);
                    img.src = src;
                }
            });
        }

        function filterCards() { renderCardsCatalogue(); }

        function addToDeck(athleteId) {
            const emptyIdx = userState.deck.indexOf(null);
            if (emptyIdx !== -1) { userState.deck[emptyIdx] = athleteId; saveUser(); }
        }
        function removeFromDeck(idx) { userState.deck[idx] = null; saveUser(); }

        function renderDeck() {
            const container = document.getElementById('active-deck-slots');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const id = userState.deck[i];
                if (id) {
                    const athlete = athletesData.find(a => a.id === id);
                    container.innerHTML += `
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-cyan-500/30 flex items-center justify-between shadow-[0_4px_20px_rgba(0,0,0,0.5)]">
                            <div class="truncate mr-2">
                                <h6 class="font-bold text-sm text-white truncate">${athlete.name}</h6>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-[10px] text-cyan-400 font-sport uppercase bg-cyan-900/30 px-2 py-0.5 rounded">${athlete.sport}</span>
                                    <span class="text-[10px] text-amber-300 font-mono font-bold">OVR ${athlete.score}</span>
                                </div>
                            </div>
                            <button onclick="removeFromDeck(${i})" class="w-8 h-8 rounded-full bg-rose-500/10 text-rose-400 flex items-center justify-center hover:bg-rose-500 hover:text-white transition-colors shrink-0">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>`;
                } else {
                    container.innerHTML += `
                        <div class="bg-slate-950/40 p-4 rounded-2xl border border-dashed border-slate-700 flex flex-col items-center justify-center text-slate-500 h-[72px]">
                            <i class="fa-solid fa-plus mb-1 opacity-50"></i>
                            <span class="text-[10px] uppercase tracking-wider font-bold">Slot Vide</span>
                        </div>`;
                }
            }
        }

        function renderDeckQuickAdd() {
            const container = document.getElementById('deck-quick-add-container');
            if (!container) return;
            const owned = athletesData.filter(a => userState.collection[a.id] > 0 && !userState.deck.includes(a.id));
            container.innerHTML = owned.length === 0 ? `<p class="text-sm text-slate-500 col-span-full py-4 text-center">Aucun autre athlète disponible dans votre collection.</p>` : '';
            owned.forEach(athlete => {
                container.innerHTML += `
                    <div onclick="addToDeck('${athlete.id}')" class="bg-slate-900 border border-slate-700 hover:border-cyan-500 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition-all group">
                        <div class="font-bold text-xs text-white truncate group-hover:text-cyan-400 transition-colors">${athlete.name}</div>
                        <div class="text-[10px] text-amber-400 font-mono mt-1">OVR ${athlete.score}</div>
                    </div>`;
            });
        }

        window.onload = function() { initUser(); };
    </script>
</body>
</html>
